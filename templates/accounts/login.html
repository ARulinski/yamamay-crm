{% extends "base.html" %}

{% block title %}
Login | Yamamay CRM
{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <div class="brand">
            yamamay
        </div>

        <h1>Welcome back</h1>

        <p class="login-subtitle">
            Sign in to your CRM account
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="id_password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    required
                >
            </div>

            {% if form.errors %}
                <div class="form-error">
                    Incorrect username or password.
                </div>
            {% endif %}

            <button
                type="submit"
                class="primary-button"
            >
                Sign in
            </button>

        </form>

    </div>

</div>

{% endblock %}
